<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KnowUrBite - Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Write Your Review</h1>
        
        <div class="prediction-summary">
            <h3>Previous Analysis Result:</h3>
            <p class="prediction-result">{{ session.get('prediction_result', 'No analysis performed yet') }}</p>
        </div>
        
        <form action="{{ url_for('submit_review') }}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="review">Your Review:</label>
                <textarea name="review" id="review" rows="5" placeholder="Describe your experience with this product..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="proof_image">Proof Image (Optional):</label>
                <input type="file" name="proof_image" id="proof_image" accept="image/*">
            </div>
            
            <div class="form-group">
                <label for="vendor_info">Vendor Information (Optional):</label>
                <input type="text" name="vendor_info" id="vendor_info" placeholder="Store name, location, or GSTIN">
            </div>
            
            <input type="submit" value="Submit Report" class="btn-primary">
        </form>
        
        <a href="{{ url_for('check_method') }}" class="back-link">Back to Check Methods</a>
    </div>
</body>
</html>
